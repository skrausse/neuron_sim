[neuron]
neuron_type = "LIF"
num_neurons = 100
v_rest = 0.0
v_thresh = 40.0
tau = 10.0
tau_ref = 5.0                        # Only used for RefLIF, encoding the refractory period

[weights]
strength_e = 250.0
strength_i = 50.0
sigma_e = 10.0
sigma_i = 40.0

[simulation]
# Simulation loop parameters
dt = 1.0
num_timesteps = 1000

# External network stimulation parameters
stimulation_length = 100                # Type: usize
background_strength = 0.0

first_pulse_strength = 50.0
first_pulse_start = 0                   # Type: usize

second_pulse_strength = 50.0
second_pulse_start = 500                # Type: usize